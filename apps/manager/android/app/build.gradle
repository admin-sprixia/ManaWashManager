apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // This is an npm workspaces monorepo — node_modules is hoisted to the repo root
    // (4 levels up from android/app: app -> android -> mobile -> apps -> root), not local
    // to apps/manager, so the plugin's defaults (which assume a standalone project) are wrong.
    //   The root of your project, i.e. where "package.json" lives.
    root = file("../../")
    //   The folder where the react-native NPM package is.
    reactNativeDir = file("../../../../node_modules/react-native")
    //   The folder where the react-native Codegen package is.
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint.
    cliFile = file("../../../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    //   Hoisted to the repo root like the folders above (rootDir is apps/manager/android).
    hermesCommand = "$rootDir/../../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * R8 shrinks and obfuscates the Java/Kotlin code in release builds (smaller download, harder to
 * pick apart). Library keep rules come with each library; ours are in proguard-rules.pro.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * Google Maps key for the community location pin, from -PMAPS_API_KEY or MAPS_API_KEY in
 * android/local.properties (never committed). Without it the app still works: the pin screen
 * falls back to "Use my location" and an Open in Google Maps link.
 */
def mapsApiKey = {
    def fromProperty = findProperty("MAPS_API_KEY")
    if (fromProperty) return fromProperty.toString().trim()
    def local = rootProject.file("local.properties")
    if (!local.exists()) return ""
    def props = new Properties()
    local.withInputStream { props.load(it) }
    return (props.getProperty("MAPS_API_KEY") ?: "").trim()
}()

/** True when the private upload key's four properties are set (in ~/.gradle/gradle.properties). */
def uploadKeyConfigured = ["MANA_UPLOAD_STORE_FILE", "MANA_UPLOAD_STORE_PASSWORD", "MANA_UPLOAD_KEY_ALIAS", "MANA_UPLOAD_KEY_PASSWORD"]
    .every { project.hasProperty(it) && project.property(it) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sprixia.manawashpartner"
    defaultConfig {
        applicationId "com.sprixia.manawashpartner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 501
        versionName "0.5.1"
        manifestPlaceholders = [mapsApiKey: mapsApiKey]
        buildConfigField "boolean", "MAPS_ENABLED", mapsApiKey ? "true" : "false"
        // React Native's prebuilt libraries ship every ABI; keep only the ones gradle.properties
        // (or run-android's active-arch flag) asks for, so emulator-only x86 code isn't shipped.
        ndk {
            abiFilters(*findProperty("reactNativeArchitectures").split(",").collect { it.trim() })
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // The private upload key, from ~/.gradle/gradle.properties (never this repo). Anyone
        // holding the shared debug key could otherwise sign an "update" that replaces this app.
        if (uploadKeyConfigured) {
            release {
                storeFile file(MANA_UPLOAD_STORE_FILE)
                storePassword MANA_UPLOAD_STORE_PASSWORD
                keyAlias MANA_UPLOAD_KEY_ALIAS
                keyPassword MANA_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with the upload key; preReleaseBuild below refuses to build without it.
            signingConfig uploadKeyConfigured ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// A release build must talk to the deployed API. Fail early instead of shipping an app that
// can't reach anything. (Smoke builds on CI can pass -PskipApiUrlCheck.)
afterEvaluate {
    tasks.named("preReleaseBuild").configure {
        doFirst {
            // A local smoke build may pass -PdebugSignedRelease; nothing built that way goes to a phone.
            if (!uploadKeyConfigured && !project.hasProperty("debugSignedRelease")) {
                throw new GradleException(
                    "Release builds must be signed with the private upload key.\n" +
                    "Set MANA_UPLOAD_STORE_FILE, MANA_UPLOAD_STORE_PASSWORD, MANA_UPLOAD_KEY_ALIAS and\n" +
                    "MANA_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties (see README → Release signing).")
            }
        }
        doFirst {
            if (project.hasProperty("skipApiUrlCheck")) return
            def cfg = new groovy.json.JsonSlurper().parse(file("../../src/config/release.json"))
            def url = cfg.productionApiUrl ?: ""
            if (!(url ==~ /^https:\/\/\S+$/) || url.contains("REPLACE_")) {
                throw new GradleException(
                    "productionApiUrl in apps/manager/src/config/release.json is not set.\n" +
                    "Run: npm run set-api-url -- https://mana-api.<subdomain>.workers.dev")
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// 4 levels up (app -> android -> mobile -> apps -> repo root) — node_modules is hoisted
// to the repo root in this npm workspaces monorepo.
apply from: file("../../../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
